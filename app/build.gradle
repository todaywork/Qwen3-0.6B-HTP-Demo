plugins {
    id "com.android.application"
}

// 纯外壳 App：UI + 批量测试工具。推理能力全部来自 :geniehtp library（AAR）。
// 渠道 flavor 与 library 保持一致，Gradle 会按渠道名自动匹配依赖变体。
android {
    namespace "com.qairt.qwen3htp"
    compileSdk 35

    defaultConfig {
        applicationId "com.qairt.qwen3htp"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    flavorDimensions "htp", "qnn"
    productFlavors {
        v68 {
            dimension "htp"
            versionNameSuffix "-v68"
        }
        v73 {
            dimension "htp"
            versionNameSuffix "-v73"
        }
        qnn234 {
            dimension "qnn"
            versionNameSuffix "-qnn234"
        }
        qnn246 {
            dimension "qnn"
            versionNameSuffix "-qnn246"
        }
    }

    // Channel-specific app names, e.g. "Qwen3 0.6B HTP Demo V68 QNN246".
    // (single-flavor resValue would override each other across dimensions)
    androidComponents {
        onVariants(selector().all()) { variant ->
            def names = variant.productFlavors.collect { it.second.toUpperCase() }
            variant.resValues.put(
                variant.makeResValueKey("string", "app_name"),
                new com.android.build.api.variant.ResValue(
                    "Qwen3 0.6B HTP Demo " + names.join(" "), null))
        }
    }

    // Legacy mixed runtime directories under app/src/main/{jniLibs,assets} are
    // intentionally excluded from every APK (they shadow the library's channel so).
    sourceSets {
        main {
            jniLibs.srcDirs = []
            assets.srcDirs = []
        }
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

dependencies {
    implementation project(":geniehtp")
    implementation "androidx.core:core:1.13.1"
}
