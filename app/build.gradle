plugins {
    id "com.android.application"
}

android {
    namespace "com.qairt.qwen3htp"
    compileSdk 35

    defaultConfig {
        applicationId "com.qairt.qwen3htp"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        def diagnosticsEnabled = providers.gradleProperty("enableNpuDiagnostics")
                .map { it.toBoolean() }
                .orElse(true)
                .get()
        buildConfigField "boolean", "NPU_DIAGNOSTICS_ENABLED", diagnosticsEnabled.toString()

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions -frtti"
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    if (findProject(":npu-diagnostics") != null) {
        implementation project(":npu-diagnostics")
    }
}
